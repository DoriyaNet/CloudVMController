<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CloudVMController — 本地运行的 Linode 与 Oracle Cloud 实例控制台。"
    />
    <meta name="theme-color" content="#000000" />
    <title>CloudVMController</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />

    <div class="mobile-scrim" id="mobile-scrim" hidden></div>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#overview" aria-label="CloudVMController 首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M16 3 28.5 10.2v11.6L16 29 3.5 21.8V10.2Z" />
              <path d="M11.5 12.4 16 9.8l4.5 2.6v5.2L16 20.2l-4.5-2.6Z" />
              <path d="M16 15.2v2.4" />
            </svg>
          </span>
          <span class="brand-type">
            <span class="brand-name">CloudVM</span>
            <span class="brand-sub">CONTROLLER</span>
          </span>
        </a>

        <div class="sidebar-cloud">
          <span class="workspace-avatar">CV</span>
          <span class="workspace-copy">
            <strong>Local workspace</strong>
            <small><span class="pulse-dot"></span> Multi-cloud API</small>
          </span>
          <span class="sidebar-cloud-env">LOCAL</span>
        </div>

        <nav class="primary-nav" aria-label="主导航">
          <span class="nav-label">控制台</span>
          <a class="nav-item" href="#overview" data-nav="overview">
            <span class="nav-icon" data-icon="grid"></span>
            <span>概览</span>
          </a>
          <a class="nav-item" href="#instances" data-nav="instances">
            <span class="nav-icon" data-icon="server"></span>
            <span>实例</span>
            <span class="nav-count" id="nav-instance-count">—</span>
          </a>
          <a class="nav-item" href="#create" data-nav="create">
            <span class="nav-icon" data-icon="plus"></span>
            <span>部署实例</span>
          </a>
          <span class="nav-label nav-label-secondary">配置</span>
          <a class="nav-item" href="#settings" data-nav="settings">
            <span class="nav-icon" data-icon="settings"></span>
            <span>连接与设置</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-account" id="sidebar-account">
            <span class="avatar avatar-sm" id="sidebar-avatar">CV</span>
            <span class="sidebar-account-copy">
              <strong id="sidebar-account-name">未连接</strong>
              <span id="sidebar-account-email">选择 API 令牌后开始</span>
            </span>
          </div>
          <div class="sidebar-meta">
            <span>v1.2.0</span>
              <span class="sidebar-meta-dot"></span>
              <span>CONTROL PLANE</span>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-button mobile-menu-button"
              id="mobile-menu-button"
              type="button"
              aria-label="打开导航"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <span data-icon="menu"></span>
            </button>
            <div class="breadcrumb">
              <span class="breadcrumb-root">CloudVMController</span>
              <span class="breadcrumb-separator">/</span>
              <span class="breadcrumb-current" id="topbar-title">概览</span>
            </div>
          </div>

          <div class="topbar-right">
            <button
              class="command-search"
              id="global-search"
              type="button"
              data-action="global-search"
              aria-label="搜索实例"
            >
              <span data-icon="search"></span>
              <span>搜索实例</span>
              <kbd>/</kbd>
            </button>
            <div class="connection-pill is-idle" id="connection-status">
              <span class="connection-dot"></span>
              <span class="connection-label">未连接</span>
            </div>
            <button
              class="icon-button"
              id="refresh-button"
              type="button"
              aria-label="刷新数据"
              title="刷新数据"
            >
              <span data-icon="refresh"></span>
            </button>
            <button
              class="avatar avatar-button"
              id="token-button"
              type="button"
              aria-label="管理云凭据"
              title="管理云凭据"
            >
              <span id="topbar-avatar-text">CV</span>
              <span class="avatar-status"></span>
            </button>
          </div>
        </header>

        <main class="view-root" id="view-root">
          <div class="boot-screen">
            <div class="boot-orbit">
              <span></span>
            </div>
            <p>正在初始化控制台</p>
          </div>
        </main>
      </div>
    </div>

    <div id="drawer-root"></div>
    <div id="modal-root"></div>
    <div class="toast-stack" id="toast-root" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <div class="noscript-message">
        CloudVMController 需要启用 JavaScript 才能运行。
      </div>
    </noscript>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
